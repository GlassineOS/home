name: build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        # the device is aarch64: the sandbox's syscall filter differs per architecture
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      # GlassineOS/ui (the voices and the drawing) is cloned by test/ui.sh at GLASSINE_UI_REF (main).
      # The renders land in out/renders and are kept as an artifact.
      - name: make check on Alpine
        run: |
          docker run --rm -e GLASSINE_UI_REF -v "$PWD":/src -w /src alpine:3.24 sh -euc '
            apk add -q build-base lua5.4-dev pkgconf linux-headers git curl \
              cairo-dev pango-dev librsvg-dev glib-dev gdk-pixbuf-dev python3 py3-gobject3 py3-cairo gtk+3.0 \
              font-dejavu font-eb-garamond adwaita-icon-theme wayland-dev wayland-protocols libxkbcommon-dev
            make check'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: renders-${{ matrix.runner }}
          path: out/renders/
          if-no-files-found: ignore
