# Continue reading: the book read last in KOReader.
name = "Continue reading"
icon = "menu_book"
description = "The book you read last in KOReader, with its progress."
sizes = ["wide", "half"]
# KOReader's history (the Flatpak's and the package's), and the user's books folder (KOReader
# keeps BOOK.sdr/ beside each book).
reads = ["~/.var/app/rocks.koreader.KOReader/config/koreader/history.lua", "~/.config/koreader/history.lua", "{books}/"]
refresh = { on_change = true }
